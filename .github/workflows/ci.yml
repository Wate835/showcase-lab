name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

  photo-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/photo-editor/package-lock.json

      - name: Install
        working-directory: packages/photo-editor
        run: npm ci

      - name: Lint
        working-directory: packages/photo-editor
        run: npm run lint

      - name: Build lib
        working-directory: packages/photo-editor
        run: npm run build:lib

      - name: Check artifact
        run: test -f static/photo-editor/mount.js

  frontend:
    needs: [photo-editor]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [react, vue]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/photo-editor/package-lock.json
            frontends/${{ matrix.app }}/package-lock.json

      - name: Install photo-editor
        working-directory: packages/photo-editor
        run: npm ci

      - name: Install ${{ matrix.app }}
        working-directory: frontends/${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: frontends/${{ matrix.app }}
        run: npm run lint

      - name: Typecheck
        working-directory: frontends/${{ matrix.app }}
        run: npm run typecheck

      - name: Build
        working-directory: frontends/${{ matrix.app }}
        run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script_path: scripts/deploy.sh
