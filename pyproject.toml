[project]
name = "showcaselab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/showcaselab/bl/challenges_data.py" = ["E501"]
"src/showcaselab/bl/seed.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["showcaselab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
