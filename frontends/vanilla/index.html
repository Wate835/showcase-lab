<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showcase Lab — Vanilla</title>
    <meta
      name="description"
      content="Портфолио Антона Кудрявцева: fullstack, Vue/React/TypeScript и FastAPI. Один API — три фронта на выбор."
    />
    <link rel="canonical" href="https://anton-kudryavcev.ru/app/vanilla/" />
    <meta name="theme-color" content="#101014" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Showcase Lab" />
    <meta property="og:url" content="https://anton-kudryavcev.ru/app/vanilla/" />
    <meta property="og:title" content="Showcase Lab — Vanilla" />
    <meta
      property="og:description"
      content="Портфолио Антона Кудрявцева: fullstack, Vue/React/TypeScript и FastAPI. Один API — три фронта на выбор."
    />
    <meta property="og:image" content="https://anton-kudryavcev.ru/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("showcase-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            localStorage.setItem("showcase-theme", theme);
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var locale = localStorage.getItem("showcase-locale");
          if (locale !== "en" && locale !== "ru") {
            var nav = String(navigator.language || (navigator.languages && navigator.languages[0]) || "").toLowerCase();
            locale = nav.indexOf("en") === 0 ? "en" : "ru";
            localStorage.setItem("showcase-locale", locale);
          }
          document.documentElement.setAttribute("lang", locale);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.setAttribute("lang", "ru");
        }
      })();
    </script>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="/app/shared/styles.css" />
    <link rel="stylesheet" href="./src/motion.css" />
  </head>
  <body data-framework="vanilla">
    <div class="shell is-motion">
      <a class="skip-link" href="#main-content" id="skipLink">К содержимому</a>
      <header class="topbar" id="topbar">
        <a class="logo" href="#about">Showcase Lab</a>
        <button
          type="button"
          class="nav-toggle"
          id="navToggle"
          aria-expanded="false"
          aria-controls="menuPanel"
          aria-label="Open menu"
        >
          <span class="nav-toggle-bars" aria-hidden="true"></span>
        </button>
        <div class="menu-panel" id="menuPanel">
          <nav class="nav" id="nav"></nav>
          <div class="topbar-controls">
            <button type="button" class="switch switch--icon" id="themeToggle" aria-label="Toggle theme" data-tip="Toggle theme">
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
              </svg>
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" />
              </svg>
            </button>
            <button type="button" class="switch" id="localeToggle" aria-label="Toggle language">EN</button>
            <a class="switch switch--icon" id="switchStack" href="/?choose=1" aria-label="Switch stack" data-tip="Switch stack">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2 3 7l9 5 9-5-9-5z" />
                <path d="M3 12l9 5 9-5M3 17l9 5 9-5" />
              </svg>
            </a>
          </div>
        </div>
      </header>
      <main id="main-content" class="content" tabindex="-1"><div id="app"></div></main>
      <footer class="footer">
        <span class="badge">Vanilla JS · amber</span>
        <nav class="footer-contacts" id="footerContacts" aria-label="Контакты">
          <a id="footerTelegram" href="https://t.me/Antonygoood" target="_blank" rel="noreferrer">Telegram</a>
          <a id="footerEmail" href="mailto:santahoe@mail.ru">santahoe@mail.ru</a>
          <a id="footerGithub" href="https://github.com/Wate835" target="_blank" rel="noreferrer">GitHub</a>
        </nav>
        <span id="footerApi">API: FastAPI + SQLAlchemy</span>
      </footer>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
