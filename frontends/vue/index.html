<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showcase Lab — Vue 3</title>
    <meta
      name="description"
      content="Портфолио Антона Кудрявцева: fullstack, Vue/React/TypeScript и FastAPI. Один API — три фронта на выбор."
    />
    <link rel="canonical" href="https://anton-kudryavcev.ru/app/vue/" />
    <meta name="theme-color" content="#101014" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Showcase Lab" />
    <meta property="og:url" content="https://anton-kudryavcev.ru/app/vue/" />
    <meta property="og:title" content="Showcase Lab — Vue 3" />
    <meta
      property="og:description"
      content="Портфолио Антона Кудрявцева: fullstack, Vue/React/TypeScript и FastAPI. Один API — три фронта на выбор."
    />
    <meta property="og:image" content="https://anton-kudryavcev.ru/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("showcase-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            localStorage.setItem("showcase-theme", theme);
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var locale = localStorage.getItem("showcase-locale");
          if (locale !== "en" && locale !== "ru") {
            var nav = String(navigator.language || (navigator.languages && navigator.languages[0]) || "").toLowerCase();
            locale = nav.indexOf("en") === 0 ? "en" : "ru";
            localStorage.setItem("showcase-locale", locale);
          }
          document.documentElement.setAttribute("lang", locale);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.setAttribute("lang", "ru");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
